<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawtopia - Stray Animal Management &amp; Rabies Control</title>
    <meta name="description" content="A better world for every paw - Stray Dog &amp; Cat Management and Rabies Control platform." />
    <meta property="og:title" content="Pawtopia - Stray Animal Management &amp; Rabies Control" />
    <meta property="og:description" content="A better world for every paw - Stray Dog &amp; Cat Management and Rabies Control platform." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/paw.png" />
    <link rel="apple-touch-icon" href="/paw.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pawtopia_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
