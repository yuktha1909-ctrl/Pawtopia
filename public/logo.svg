<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <!-- Background Warm Cream Canvas (optional for standalone viewing) -->
  <rect width="600" height="680" fill="#FAF6EE" rx="24"/>
  
  <g transform="translate(100, 40)">
    <!-- Outer Rounded Hexagon Teal Border -->
    <path d="M 200 10 
             L 340 90 
             Q 360 102 360 125 
             L 360 275 
             Q 360 298 340 310 
             L 200 390 
             Q 180 402 160 390 
             L 20 310 
             Q 0 298 0 275 
             L 0 125 
             Q 0 102 20 90 
             L 160 10 
             Q 180 -2 200 10 Z" 
          fill="none" stroke="#0B3E39" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner Teal Filled Hexagon Shield -->
    <path d="M 180 50 
             L 295 116 
             Q 310 125 310 142 
             L 310 258 
             Q 310 275 295 284 
             L 180 350 
             Q 165 358 150 350 
             L 35 284 
             Q 20 275 20 258 
             L 20 142 
             Q 20 125 35 116 
             L 150 50 
             Q 165 42 180 50 Z" 
          fill="#0B3E39"/>

    <!-- Paw Cutout Elements (Cream #FAF6EE) -->
    <!-- Toe 1 (Far Left) -->
    <ellipse cx="108" cy="162" rx="18" ry="24" transform="rotate(-20 108 162)" fill="#FAF6EE"/>
    
    <!-- Toe 2 (Center Left) -->
    <ellipse cx="146" cy="132" rx="19" ry="27" transform="rotate(-6 146 132)" fill="#FAF6EE"/>
    
    <!-- Toe 3 (Center Right) -->
    <ellipse cx="198" cy="132" rx="19" ry="27" transform="rotate(6 198 132)" fill="#FAF6EE"/>
    
    <!-- Toe 4 (Far Right) -->
    <ellipse cx="236" cy="162" rx="18" ry="24" transform="rotate(20 236 162)" fill="#FAF6EE"/>

    <!-- Curled Main Paw Pad with Tail Embrace -->
    <path d="M 172 170 
             C 142 170 125 188 125 212 
             C 125 240 152 260 178 260 
             C 192 260 206 248 206 232 
             C 206 208 185 200 175 194 
             C 165 188 162 182 165 178 
             C 167 174 172 172 177 174 
             C 190 178 200 196 200 216 
             C 200 252 168 285 132 285 
             C 95 285 70 250 70 205 
             C 70 150 120 115 175 115 
             C 198 115 220 122 238 135 
             C 218 152 195 170 172 170 Z" 
          fill="#FAF6EE"/>
  </g>

  <!-- Brand Typography -->
  <text x="300" y="525" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="60" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#0B3E39" 
        text-anchor="middle">PAWTOPIA</text>

  <text x="300" y="575" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="9" 
        fill="#0B3E39" 
        text-anchor="middle">A BETTER WORLD FOR EVERY PAW.</text>
</svg>
